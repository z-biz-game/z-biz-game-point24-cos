name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The solver and the shipped pool are pure ES modules: no browser, no install step.
  # anchor.test.mjs is the job that matters here — it enumerates all 1820 rank multisets and
  # requires exactly 1362 of them to make 24, which is the completeness claim for the
  # rational solver. library.test.mjs re-solves every hand in js/data/lots.js, so a
  # hand-edited number or a stale bake fails the build.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in js/*.js js/*/*.js server.cjs electron/main.cjs tools/*.mjs test/*.mjs; do node --check "$f"; done
      - name: Suites
        run: for f in test/*.test.mjs; do echo "::group::$f"; node "$f"; echo "::endgroup::"; done

  # The shell is only proven by driving a real page with real input events.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
